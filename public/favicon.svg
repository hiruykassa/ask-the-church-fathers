<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2a1e0e"/>
      <stop offset="100%" stop-color="#0e0a06"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- Cross shape — same proportions as the &#9841; on the site -->
  <g filter="url(#glow)">
    <!-- Vertical arm -->
    <rect x="45.5" y="13" width="9" height="74" rx="2.5" fill="#c8943e"/>
    <!-- Horizontal arm (at ~36% from top — classical cross proportion) -->
    <rect x="22" y="34" width="56" height="9" rx="2.5" fill="#c8943e"/>
    <!-- Small horizontal cap at the very top (Eastern cross style) -->
    <rect x="36" y="13" width="28" height="7" rx="2" fill="#c8943e"/>
    <!-- Small footrest at the bottom (Eastern cross / Orthodox style) -->
    <rect x="34" y="76" width="32" height="6" rx="1.5"
          fill="#c8943e"
          transform="rotate(-20 50 79)"/>
  </g>
</svg>
