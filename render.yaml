# Render.com blueprint — one-click deploy of the Flask backend.
# https://render.com/docs/blueprint-spec
#
# After importing this repo as a Blueprint, set the values marked `sync: false`
# in the Render dashboard (secrets + your frontend origin + the database URL).
services:
  - type: web
    name: ask-the-early-church-api
    runtime: python
    rootDir: backend
    plan: starter
    # -w 1: each gunicorn worker holds the full embedding matrix in RAM, so a
    # single worker keeps memory bounded on the starter plan. It also makes the
    # in-memory rate limiter exact (no per-worker N× looseness). Scale to -w 2+
    # only with a larger instance and a shared RATELIMIT_STORAGE_URI.
    buildCommand: pip install -r requirements.txt
    startCommand: bash prestart.sh && gunicorn -w 1 -b 0.0.0.0:$PORT --timeout 60 app:app
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PRODUCTION
        value: "1"
      - key: VOYAGE_MODEL
        value: voyage-3
      # Your deployed frontend origin, e.g. https://asktheearlychurch.com
      - key: ALLOWED_ORIGIN
        sync: false
      # Signed/public URL to database.db (Cloudflare R2 / S3); fetched on boot.
      - key: DB_URL
        sync: false
      # Secrets — set in the dashboard, never commit.
      - key: VOYAGE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Anthropic (Claude) — query-parse path is disabled in app.py today, but
      # this slot is declared now so enabling it later is dashboard-only.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional: a Redis URL so rate limits are shared across workers.
      - key: RATELIMIT_STORAGE_URI
        sync: false
