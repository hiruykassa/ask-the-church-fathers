name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Fetch test database
        working-directory: backend
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: |
          if [ -n "$DB_URL" ]; then
            bash prestart.sh
          else
            echo "[ci] DB_URL secret not set — skipping database fetch; smoke tests will be skipped."
          fi

      - name: Run smoke tests
        working-directory: backend
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ALLOWED_ORIGIN: http://localhost:5173
        run: |
          if [ -f database.db ]; then
            pytest -q
          else
            echo "[ci] No database.db — skipping smoke tests (set DB_URL secret to enable)"
          fi

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          # CI verifies the build only — real URL is set on Netlify.
          VITE_API_URL: https://placeholder.invalid
        run: npm run build
